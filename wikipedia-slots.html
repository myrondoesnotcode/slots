<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Slots</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands and Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            /* Deep Casino Red/Purple Background */
            background: radial-gradient(circle at center, #2e0228 0%, #1a0115 100%);
            color: white;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none; /* Hide default mouse cursor for immersion */
        }

        /* The canvas sits on top for the hand skeleton */
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            /* Flipped horizontally to create a mirror effect for the skeleton */
            transform: scaleX(-1);
        }

        #input_video { display: none; }

        /* Slot Machine Styles */
        .slot-machine {
            background: linear-gradient(to bottom, #4a0e4e 0%, #250229 100%);
            border: 8px solid #ffd700;
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.5),
                inset 0 0 50px rgba(0,0,0,0.8);
            border-radius: 40px;
            padding: 40px;
            position: relative;
            z-index: 10;
            transform: scale(1.1);
        }

        .title-sign {
            background: #000;
            color: #fff;
            padding: 10px 30px;
            border-radius: 100px;
            border: 4px solid #f0f;
            box-shadow: 0 0 15px #f0f;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 5px #fff;
        }

        .reel-window {
            background: #000;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid #555;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
            display: flex;
            gap: 15px;
        }

        .article-container {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .article-titles-reel {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .article-title-scroll {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transition: none;
        }

        .article-title-scroll.spinning {
            animation: titleScroll 0.08s linear infinite;
            filter: blur(2px);
        }

        .article-title-scroll.stopping {
            animation: none;
            transition: transform 0.6s cubic-bezier(0.17, 0.67, 0.35, 1.0);
            filter: blur(0px);
        }

        .scroll-title-item {
            font-size: 1rem;
            color: #ffd700;
            text-align: center;
            padding: 4px 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        @keyframes titleScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-48px); }
        }

        .article-content {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 12px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .article-title {
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .article-extract {
            font-size: 0.78rem;
            color: #e0e0e0;
            line-height: 1.5;
            flex: 1;
            overflow-y: auto;
        }

        .open-article-btn {
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            transition: all 0.2s;
            box-shadow: 0 0 0px rgba(255,0,0,0);
            align-self: center;
        }

        .open-article-btn:hover,
        .open-article-btn.hovered {
            background: #ff0000;
            box-shadow: 0 0 16px rgba(255,0,0,0.8);
            transform: scale(1.05);
        }

        /* Lever Zone */
        .lever-base {
            position: absolute;
            right: -60px;
            bottom: 50px;
            width: 40px;
            height: 100px;
            background: #555;
            border-radius: 0 20px 20px 0;
            border: 2px solid #333;
            z-index: 5;
        }

        .lever-arm {
            position: absolute;
            bottom: 60px; /* Pivot point */
            right: -40px;
            width: 15px;
            height: 150px; /* Shortened from 180px to keep on screen */
            background: linear-gradient(to right, #ccc, #fff, #ccc);
            transform-origin: bottom center;
            transform: rotate(0deg); /* Resting state */
            transition: transform 0.1s ease-out; /* Fast reaction */
            border-radius: 5px;
            z-index: 4;
        }

        .lever-knob {
            width: 70px; 
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #990000);
            border-radius: 50%;
            position: absolute;
            top: -35px;
            left: -28px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* Visual Feedback States for Knob */
        .lever-knob.hovered {
            background: radial-gradient(circle at 30% 30%, #4ade80, #166534); /* Green */
            box-shadow: 0 0 20px #4ade80;
            transform: scale(1.2);
        }

        .lever-knob.pulled {
            background: radial-gradient(circle at 30% 30%, #fbbf24, #b45309); /* Yellow/Gold */
            box-shadow: 0 0 30px #fbbf24;
        }

        /* Stats Panel */
        .stats-panel {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            min-width: 100px;
        }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        /* Win Message Animation */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Mobile portrait */
        @media (max-width: 480px) {
            body {
                padding-top: 10px !important;
                padding-bottom: 20px !important;
            }

            .slot-machine {
                transform: none;
                padding: 14px;
                border-radius: 18px;
                border-width: 4px;
            }

            .title-sign {
                padding: 5px 14px;
                letter-spacing: 1px;
                font-size: 0.7rem;
                border-width: 2px;
                margin-bottom: 10px;
            }

            .reel-window {
                padding: 8px;
                gap: 6px;
                border-width: 2px;
            }

            .article-container { height: 160px; }
            .article-title { font-size: 0.9rem; }
            .article-extract { font-size: 0.7rem; }
            .open-article-btn { font-size: 0.72rem; padding: 6px 10px; }

            .lever-base {
                right: -25px;
                bottom: 35px;
                width: 20px;
                height: 50px;
            }

            .lever-arm {
                right: -18px;
                bottom: 40px;
                width: 8px;
                height: 85px;
            }

            .lever-knob {
                width: 36px;
                height: 36px;
                top: -18px;
                left: -14px;
            }

            .stats-panel {
                gap: 8px;
                margin-top: 10px;
            }

            .stat-box {
                padding: 6px 10px;
                min-width: 65px;
            }

            .stat-box .text-2xl {
                font-size: 1.1rem;
            }

        }

        /* Mobile landscape — requires BOTH short height AND narrow width to avoid desktop */
        @media (max-height: 500px) and (max-width: 900px) {
            body {
                padding-top: 5px !important;
                padding-bottom: 5px !important;
            }

            .slot-machine {
                transform: none;
                padding: 10px;
                border-radius: 14px;
                border-width: 3px;
            }

            .title-sign {
                padding: 3px 10px;
                margin-bottom: 6px;
                font-size: 0.65rem;
                border-width: 2px;
            }

            .reel-window {
                padding: 6px;
                gap: 6px;
                border-width: 2px;
            }

            .article-container { height: 120px; }
            .article-title { font-size: 0.8rem; }
            .article-extract { font-size: 0.65rem; }

            .lever-base {
                right: -25px;
                bottom: 25px;
                width: 20px;
                height: 50px;
            }

            .lever-arm {
                right: -18px;
                bottom: 30px;
                width: 8px;
                height: 80px;
            }

            .lever-knob {
                width: 34px;
                height: 34px;
                top: -17px;
                left: -14px;
            }

            .stats-panel {
                gap: 6px;
                margin-top: 4px;
            }

            .stat-box {
                padding: 3px 6px;
                min-width: 55px;
            }

            .stat-box .text-2xl {
                font-size: 1rem;
            }

            #win-message {
                height: 1.5rem !important;
                margin-top: 0.2rem !important;
                font-size: 1rem !important;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen pt-20 pb-40">

    <!-- Loading Screen -->
    <div id="loading" class="loading-screen">
        <h1 class="text-4xl text-yellow-400 mb-4 font-bold">Setting up Casino...</h1>
        <p class="text-gray-400">Please enable your camera to control the hand.</p>
        <p class="text-gray-600 text-sm mt-2">(Your video is NOT shown on screen)</p>
        <div id="loading-error" style="display:none; margin-top:20px; text-align:center;">
            <p class="text-red-400 mb-4">Camera unavailable or timed out.</p>
            <button id="skip-camera-btn" onclick="skipCamera()" style="background:#ffd700;color:#111;padding:12px 28px;border:none;border-radius:25px;font-size:1rem;font-weight:bold;cursor:pointer;">
                Play Without Camera
            </button>
        </div>
    </div>

    <!-- Hidden Video Source -->
    <video id="input_video" playsinline muted autoplay></video>

    <!-- Canvas for Virtual Hand & Confetti -->
    <canvas id="output_canvas"></canvas>

    <!-- Game Container -->
    <div class="flex flex-col items-center relative">
        
        <div class="slot-machine">
            <div class="flex justify-center w-full">
                <div class="title-sign">📖 WIKI SLOTS 📖</div>
            </div>

            <div class="reel-window">
                <div class="article-container" id="articleContainer">
                    <div class="article-titles-reel" id="titleReel">
                        <div class="article-title-scroll" id="titleScroll"></div>
                    </div>
                    <div class="article-content" id="articleContent" style="display:none;">
                        <h2 class="article-title" id="articleTitle"></h2>
                        <div class="article-extract" id="articleExtract"></div>
                        <button class="open-article-btn" id="openArticleBtn" onclick="openCurrentArticle()">
                            🔴 Open Article in New Tab
                        </button>
                    </div>
                </div>
            </div>

            <!-- The Mechanical Lever Structure -->
            <div class="lever-base"></div>
            <div class="lever-arm" id="lever-arm">
                <div class="lever-knob" id="lever-knob"></div>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stat-box">
                <div class="text-xs text-gray-400 uppercase">Articles</div>
                <div id="articlesDisplay" class="text-2xl font-mono text-green-400">0</div>
            </div>
            <div class="stat-box">
                <div class="text-xs text-gray-400 uppercase">Pulls</div>
                <div id="spinsDisplay" class="text-2xl font-mono text-blue-400">0</div>
            </div>
        </div>

        <div class="mt-8 text-gray-400 text-sm bg-black/50 px-4 py-2 rounded-full border border-gray-700 max-w-[90vw] text-center">
            Instruction: Hover until knob turns <span class="text-green-400 font-bold">GREEN</span>, <span class="text-white font-bold">MAKE A FIST</span>, PULL DOWN, then <span class="text-yellow-400 font-bold">OPEN HAND</span> to spin.
        </div>
    </div>

    <script>
        // --- GAME LOGIC ---
        let articles = 0;
        let spins = 0;
        let isSpinning = false;
        let currentArticleUrl = null;
        let prefetchedTitles = [];
        let isHoveringButton = false;
        let buttonTapCooldown = false;

        const leverArm = document.getElementById('lever-arm');

        async function fetchRandomArticle() {
            const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary');
            if (!res.ok) throw new Error('Wikipedia fetch failed');
            return res.json();
        }

        async function prefetchTitles(count = 12) {
            const fetches = Array.from({ length: count }, () =>
                fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary')
                    .then(r => r.json())
                    .then(d => d.title)
                    .catch(() => 'Unknown Article')
            );
            prefetchedTitles = await Promise.all(fetches);
        }

        function openCurrentArticle() {
            if (currentArticleUrl) window.open(currentArticleUrl, '_blank');
        }

        // Simple Audio Context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            
            if (type === 'spin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'stop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                osc.type = 'triangle';
                [440, 554, 659, 880].forEach((freq, i) => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(freq, now + i*0.1);
                    gain2.gain.setValueAtTime(0.1, now + i*0.1);
                    gain2.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.3);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(now + i*0.1);
                    osc2.stop(now + i*0.1 + 0.3);
                });
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'cocked') {
                 // Sound when lever is fully pulled down and ready
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
        }

        async function triggerSpin() {
            if (isSpinning) return;
            isSpinning = true;
            spins++;
            updateStats();
            playSound('spin');

            document.getElementById('articleContent').style.display = 'none';
            const titleScroll = document.getElementById('titleScroll');
            const titleReel = document.getElementById('titleReel');

            const displayTitles = [...prefetchedTitles, ...prefetchedTitles];
            titleScroll.innerHTML = displayTitles.map(t =>
                `<div class="scroll-title-item">${t}</div>`
            ).join('');
            titleScroll.classList.add('spinning');
            titleScroll.classList.remove('stopping');
            titleReel.style.display = 'flex';

            let article;
            try {
                article = await fetchRandomArticle();
            } catch (e) {
                article = { title: 'Connection Error', extract: 'Could not reach Wikipedia. Check your connection and try again.', content_urls: { desktop: { page: 'https://en.wikipedia.org' } } };
            }

            await new Promise(r => setTimeout(r, 1800));

            titleScroll.classList.remove('spinning');
            titleScroll.classList.add('stopping');
            playSound('stop');

            await new Promise(r => setTimeout(r, 700));

            currentArticleUrl = article.content_urls.desktop.page;
            titleReel.style.display = 'none';
            document.getElementById('articleTitle').textContent = article.title;
            document.getElementById('articleExtract').textContent = article.extract;
            document.getElementById('articleContent').style.display = 'flex';

            articles++;
            updateStats();

            prefetchTitles();

            isSpinning = false;
            animateLever(0);
        }

        function updateStats() {
            document.getElementById('articlesDisplay').textContent = articles;
            document.getElementById('spinsDisplay').textContent = spins;
        }

        function animateLever(angle) {
            leverArm.style.transform = `rotate(${angle}deg)`;
        }


        // --- COMPUTER VISION LOGIC ---

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const leverKnob = document.getElementById('lever-knob');

        let isHandClosed = false;
        let isGrabbingLever = false;
        let grabStartY = 0;
        let readyToSpin = false;
        
        function getLeverRect() {
            const rect = leverKnob.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        function onResults(results) {
            clearTimeout(cameraTimeoutId);
            document.getElementById('loading').style.display = 'none';

            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Draw Skeleton (Mirrored via CSS)
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 5});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 4});

                // Coordinates mapping
                const handX = (1 - landmarks[9].x) * canvasElement.width;
                const handY = landmarks[9].y * canvasElement.height;

                // --- NEW GRAB DETECTION (Fist instead of Pinch) ---
                // We check if fingers are curled into the palm.
                // A simple check is if the tips are lower (higher Y) than the PIP joints (knuckles).
                const indexTip = landmarks[8];
                const indexPip = landmarks[6];
                const middleTip = landmarks[12];
                const middlePip = landmarks[10];
                const ringTip = landmarks[16];
                const ringPip = landmarks[14];
                const pinkyTip = landmarks[20];
                const pinkyPip = landmarks[18];

                let curledFingers = 0;
                if (indexTip.y > indexPip.y) curledFingers++;
                if (middleTip.y > middlePip.y) curledFingers++;
                if (ringTip.y > ringPip.y) curledFingers++;
                if (pinkyTip.y > pinkyPip.y) curledFingers++;

                // If 3 or more fingers are curled, we consider it a "Grab"
                const isNowClosed = curledFingers >= 3;

                if (isNowClosed && !isHandClosed) playSound('click');
                isHandClosed = isNowClosed;

                // LEVER INTERACTION
                const leverPos = getLeverRect();
                const distToLever = Math.hypot(handX - leverPos.x, handY - leverPos.y);
                
                const GRAB_RADIUS = 150; // Grab area

                // Visual Feedback: Hover
                if (distToLever < GRAB_RADIUS && !isGrabbingLever && !isSpinning) {
                    leverKnob.classList.add('hovered');
                } else {
                    leverKnob.classList.remove('hovered');
                }

                if (isGrabbingLever) {
                    if (isHandClosed) {
                        // Dragging Phase
                        const deltaY = handY - grabStartY;
                        // Map deltaY to Angle. 
                        // Cap at 130 degrees to keep it on screen
                        let angle = Math.min(Math.max((deltaY * 0.6), 0), 130);
                        animateLever(angle);

                        // Threshold check (Triggers earlier now at 100 degrees)
                        if (angle > 100) {
                            if (!readyToSpin) {
                                readyToSpin = true;
                                leverKnob.classList.add('pulled');
                                playSound('cocked'); // Mechanical click sound
                            }
                        } else {
                            readyToSpin = false;
                            leverKnob.classList.remove('pulled');
                        }
                    } else {
                        // Release Phase
                        isGrabbingLever = false;
                        leverKnob.classList.remove('pulled');
                        
                        if (readyToSpin && !isSpinning) {
                            triggerSpin();
                        } 
                        
                        // Snap back
                        if (!readyToSpin) {
                             animateLever(0);
                        }
                        readyToSpin = false;
                    }
                } else {
                    // Check if we start grabbing
                    if (distToLever < GRAB_RADIUS && isHandClosed && !isSpinning) {
                        isGrabbingLever = true;
                        grabStartY = handY; // Set anchor point
                        readyToSpin = false;
                    }
                }
            }
        }

        // Detect mobile devices for performance tuning
        const isMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

        function skipCamera() {
            clearTimeout(cameraTimeoutId);
            document.getElementById('loading').style.display = 'none';
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: isMobile ? 0 : 1,   // Lighter model on mobile
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // Show "Play Without Camera" button if setup takes too long (12s on mobile, 20s on desktop)
        const cameraTimeoutId = setTimeout(() => {
            document.getElementById('loading-error').style.display = 'block';
        }, isMobile ? 12000 : 20000);

        const camWidth  = isMobile ? 640 : 1280;
        const camHeight = isMobile ? 360 : 720;

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: camWidth,
            height: camHeight
        });

        camera.start().catch((err) => {
            console.warn('Camera start failed:', err);
            clearTimeout(cameraTimeoutId);
            document.getElementById('loading-error').style.display = 'block';
        });

        prefetchTitles();

    </script>
</body>
</html>
